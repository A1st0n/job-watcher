name: job-watcher
on:
  schedule:
    - cron: "7,37 * * * *"  # GitHub skips many slots; any one that fires starts a ~5.5h loop
  workflow_dispatch:
concurrency:
  group: watcher
  cancel-in-progress: false  # a fired schedule waits for the running loop, then takes over
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Check every 15 minutes for ~5.5 hours
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
        run: |
          git config user.name job-watcher
          git config user.email job-watcher@users.noreply.github.com
          end=$(( $(date +%s) + 330*60 ))
          while :; do
            git pull -q --rebase || true  # a GitHub hiccup here shouldn't end the loop
            python3 watcher.py || { sleep 60; python3 watcher.py; }  # one retry, then fail so GitHub emails you
            touch new_jobs.md
            git add seen.json boards.json new_jobs.md seeded.json current_openings.md
            git diff --cached --quiet || git commit -qm "Update state"
            # -X theirs: on a seen.json clash keep this run's copy (it already holds every open job).
            # ponytail: 3 tries then carry on; an unpushed commit rides along with the next loop's push
            for t in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 30; done || true
            [ $(( $(date +%s) + 900 )) -lt "$end" ] || break
            sleep 900
          done
